<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>آلة حاسبة | BYBLOS GROUP</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
    --silver:#cfd3da;
    --dark:#0f1116;
    --glass:rgba(20,22,28,0.72);
}
*{box-sizing:border-box;}
body{
    margin:0;
    min-height:100vh;
    font-family:'Cinzel', serif;
    background:
        radial-gradient(circle at top, rgba(207,211,218,0.14), transparent 34%),
        var(--dark);
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:30px 16px;
}
.calculator{
    width:100%;
    max-width:390px;
    background:var(--glass);
    border:1px solid rgba(255,255,255,0.12);
    border-radius:26px;
    padding:24px;
    box-shadow:0 25px 70px rgba(0,0,0,0.55);
    backdrop-filter:blur(16px);
}
.top-bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:16px;
    margin-bottom:18px;
}
.top-bar a{
    color:var(--silver);
    text-decoration:none;
    font-size:13px;
    letter-spacing:1px;
}
h1{
    margin:0;
    font-size:24px;
    letter-spacing:1px;
    color:var(--silver);
}
.display{
    width:100%;
    height:82px;
    border:0;
    border-radius:18px;
    margin-bottom:18px;
    padding:18px;
    background:#090a0d;
    color:white;
    font-size:34px;
    text-align:left;
    direction:ltr;
    outline:none;
    box-shadow:inset 0 0 18px rgba(255,255,255,0.04);
}
.buttons{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:12px;
}
button{
    height:62px;
    border:0;
    border-radius:17px;
    background:#1b1e26;
    color:white;
    font-size:22px;
    cursor:pointer;
    transition:0.2s;
}
button:hover{transform:translateY(-2px);background:#252934;}
.operator{color:var(--silver);font-weight:bold;}
.clear{background:#3a2020;}
.equal{
    grid-column:span 2;
    background:linear-gradient(135deg,#cfd3da,#7c828c);
    color:#0f1116;
    font-weight:bold;
}
.zero{grid-column:span 2;}
.note{
    margin-top:16px;
    color:#aaa;
    font-size:12px;
    text-align:center;
    line-height:1.7;
}
@media(max-width:420px){
    .calculator{padding:18px;}
    button{height:56px;font-size:20px;}
    .display{height:74px;font-size:28px;}
}
</style>
</head>
<body>
<main class="calculator">
    <div class="top-bar">
        <h1>آلة حاسبة</h1>
        <a href="index.html">العودة للرئيسية</a>
    </div>

    <input class="display" id="display" type="text" value="0" readonly>

    <div class="buttons">
        <button class="clear" onclick="clearDisplay()">C</button>
        <button class="operator" onclick="deleteLast()">⌫</button>
        <button class="operator" onclick="appendValue('%')">%</button>
        <button class="operator" onclick="appendValue('/')">÷</button>

        <button onclick="appendValue('7')">7</button>
        <button onclick="appendValue('8')">8</button>
        <button onclick="appendValue('9')">9</button>
        <button class="operator" onclick="appendValue('*')">×</button>

        <button onclick="appendValue('4')">4</button>
        <button onclick="appendValue('5')">5</button>
        <button onclick="appendValue('6')">6</button>
        <button class="operator" onclick="appendValue('-')">−</button>

        <button onclick="appendValue('1')">1</button>
        <button onclick="appendValue('2')">2</button>
        <button onclick="appendValue('3')">3</button>
        <button class="operator" onclick="appendValue('+')">+</button>

        <button class="zero" onclick="appendValue('0')">0</button>
        <button onclick="appendValue('.')">.</button>
        <button class="equal" onclick="calculateResult()">=</button>
    </div>

    <p class="note">تدعم العمليات الأساسية: الجمع، الطرح، الضرب، القسمة، والنسبة المئوية.</p>
</main>

<script>
const display = document.getElementById('display');

function appendValue(value){
    if(display.value === '0' || display.value === 'Error'){
        display.value = value;
    }else{
        display.value += value;
    }
}

function clearDisplay(){
    display.value = '0';
}

function deleteLast(){
    if(display.value.length <= 1 || display.value === 'Error'){
        display.value = '0';
    }else{
        display.value = display.value.slice(0,-1);
    }
}

function calculateResult(){
    try{
        const expression = display.value.replace(/%/g, '/100');
        if(!/^[0-9+\-*/().\s]+$/.test(expression)){
            throw new Error('Invalid expression');
        }
        const result = Function('return ' + expression)();
        display.value = Number.isFinite(result) ? result : 'Error';
    }catch(error){
        display.value = 'Error';
    }
}
</script>
</body>
</html>
